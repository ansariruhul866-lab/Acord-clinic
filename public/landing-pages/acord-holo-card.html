<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ACORD Clinics Holographic Medical Card</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Bebas+Neue&family=Noto+Sans+Devanagari:wght@600;700;800&display=swap');

    :root {
      color-scheme: normal;
      --teal: #13BEB5;
      --aqua: #21C6C2;
      --mint: #89EAD7;
      --pale-aqua: #E6F8F5;
      --deep-green: #114E3F;
      --royal: #1F2F98;
      --azure: #1CA7EC;
      --ink: #031917;
      --purple: #7B4FBF;
      --amber: #F59E2B;
      --rose: #E8715A;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #eaf7fe !important;
      color-scheme: light;
      overscroll-behavior: none;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene {
      position: fixed;
      inset: 0;
      cursor: grab;
      touch-action: pan-y;
    }
    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    body.dragging #scene { cursor: grabbing; }

    .hud {
      position: fixed;
      margin: 0;
      pointer-events: none;
      z-index: 10;
    }

    .hud-controls {
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }

    .hud-btn {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid #13BEB5;
      box-shadow: 0 4px 14px rgba(19, 190, 181, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 10px;
      font-weight: 800;
      color: #0F172A;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .hud-btn:hover {
      background: #ffffff;
      border-color: #1F2F98;
      color: #1F2F98;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(19, 190, 181, 0.3);
    }
    .hud-btn:active { transform: translateY(0); }

    .hud-btn-primary {
      background: #1F2F98;
      color: #ffffff;
      border-color: #1CA7EC;
    }
    .hud-btn-primary:hover {
      background: #13BEB5;
      color: #ffffff;
      border-color: #13BEB5;
    }

    @media (max-width: 480px) {
      .hud-btn { padding: 6px 11px; font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hud-btn { transition: none; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene" role="img" aria-label="Interactive ACORD Clinics Holographic Card. Tilt with pointer, drag to rotate, double-click or press F to flip 180 degrees."></div>

  <div class="hud hud-controls">
    <button class="hud-btn" id="btnFlip" title="Flip card 180 degrees (F key)">
      <span>⇄</span>
      <span id="flipLabel">Flip 180°</span>
    </button>
    <button class="hud-btn hud-btn-primary" id="btnBook" title="Book Consultation with Specialist">
      <span>📅</span>
      <span>Book Consultation</span>
    </button>
    <button class="hud-btn" id="btnReset" title="Reset View (R key)">
      <span>↺</span>
      <span>Reset (R)</span>
    </button>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // Parse variant from URL query (?variant=clinic | dr-aakash | dr-ankita)
    const urlParams = new URLSearchParams(window.location.search);
    const variant = urlParams.get('variant') || 'clinic';

    // Setup scene, camera, renderer with generous vertical margins
    const container = document.getElementById('scene');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeaf7fe);

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 5.45); // Generous framing so card sits clearly above bottom HUD buttons

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setClearColor(0xeaf7fe, 1.0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, window.innerWidth < 640 ? 1.5 : 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    // Balanced Bright Stage Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.45);
    keyLight.position.set(3, 4, 5);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x89EAD7, 0.9);
    rimLight.position.set(-3, -2, -3);
    scene.add(rimLight);

    // Ambient Cell / Bubble Particles (Glowing, rich teal & royal blue tones)
    const particleCount = 45;
    const particleGeo = new THREE.BufferGeometry();
    const posArray = new Float32Array(particleCount * 3);
    const particleSpeeds = [];

    for (let i = 0; i < particleCount; i++) {
      posArray[i * 3 + 0] = (Math.random() - 0.5) * 5.5;
      posArray[i * 3 + 1] = (Math.random() - 0.5) * 4.5;
      posArray[i * 3 + 2] = (Math.random() - 0.5) * 3.5;
      particleSpeeds.push({
        y: 0.002 + Math.random() * 0.004,
        x: (Math.random() - 0.5) * 0.0015,
        r: Math.random() * Math.PI * 2
      });
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

    const pCanvas = document.createElement('canvas');
    pCanvas.width = 128;
    pCanvas.height = 128;
    const pCtx = pCanvas.getContext('2d');
    const pGrad = pCtx.createRadialGradient(64, 64, 0, 64, 64, 62);
    pGrad.addColorStop(0, 'rgba(19, 218, 200, 1.0)');      // Bright glowing core
    pGrad.addColorStop(0.22, 'rgba(31, 47, 152, 0.88)');   // Deep royal blue ring
    pGrad.addColorStop(0.48, 'rgba(15, 118, 110, 0.70)');  // Deep emerald body
    pGrad.addColorStop(0.78, 'rgba(19, 190, 181, 0.35)');  // Outer luminous glow halo
    pGrad.addColorStop(1, 'rgba(19, 190, 181, 0)');
    pCtx.fillStyle = pGrad;
    pCtx.fillRect(0, 0, 128, 128);
    const pTexture = new THREE.CanvasTexture(pCanvas);

    const particleMat = new THREE.PointsMaterial({
      size: 0.20,
      map: pTexture,
      transparent: true,
      opacity: 0.92,
      blending: THREE.NormalBlending,
      depthWrite: false
    });
    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    // ─────────────────────────────────────────────────────────────
    // CARD GEOMETRY & HIGH-CONTRAST CANVAS TEXTURES
    // ─────────────────────────────────────────────────────────────
    const CARD_W = 1.76;
    const CARD_H = 2.58;
    const CARD_DEPTH = 0.04;

    const logoImg = new Image();
    logoImg.crossOrigin = 'anonymous';
    logoImg.src = '/images/acord-logo.png';

    const drAakashImg = new Image();
    drAakashImg.crossOrigin = 'anonymous';
    drAakashImg.src = '/images/dr-aakash-singh.jpg';

    const drAnkitaImg = new Image();
    drAnkitaImg.crossOrigin = 'anonymous';
    drAnkitaImg.src = '/images/dr-ankita-pundir.png';

    // Generate High-Contrast Front Canvas Texture with Richer Depth
    function createFrontCanvas(vMode = variant) {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1500;
      const ctx = c.getContext('2d');

      // 1. Rich Card Background Texture with Medical Depth
      const grad = ctx.createLinearGradient(0, 0, 1024, 1500);
      grad.addColorStop(0, '#d9effb');
      grad.addColorStop(0.45, '#eef6fc');
      grad.addColorStop(1, '#cae7f8');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1500);

      // Subtle Background Wave Lines (Darker & Crisper)
      ctx.strokeStyle = 'rgba(15, 118, 110, 0.28)';
      ctx.lineWidth = 2;
      for (let y = 100; y < 1450; y += 80) {
        ctx.beginPath();
        ctx.moveTo(50, y);
        ctx.bezierCurveTo(340, y - 35, 680, y + 35, 974, y);
        ctx.stroke();
      }

      // 2. High-Contrast Glowing Outer Borders
      ctx.save();
      ctx.shadowColor = vMode === 'dr-aakash' ? 'rgba(31, 47, 152, 0.45)' : 'rgba(19, 190, 181, 0.45)';
      ctx.shadowBlur = 16;
      ctx.strokeStyle = vMode === 'dr-aakash' ? '#1F2F98' : '#0F766E';
      ctx.lineWidth = 12;
      ctx.strokeRect(36, 36, 952, 1428);
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(19, 190, 181, 0.6)';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = '#13BEB5';
      ctx.lineWidth = 3;
      ctx.strokeRect(52, 52, 920, 1396);
      ctx.restore();

      // Corner accent dots
      ctx.fillStyle = '#0F766E';
      ctx.fillRect(40, 40, 20, 20);
      ctx.fillRect(964, 40, 20, 20);
      ctx.fillRect(40, 1440, 20, 20);
      ctx.fillRect(964, 1440, 20, 20);

      if (vMode === 'dr-aakash') {
        // DR. AAKASH SINGH
        ctx.fillStyle = '#172554';
        ctx.font = '900 24px "Plus Jakarta Sans"';
        ctx.letterSpacing = '5px';
        ctx.textAlign = 'center';
        ctx.fillText('DEPARTMENT OF RHEUMATOLOGY & IMMUNOLOGY', 512, 120);

        // Circular Masked Portrait of Dr. Aakash Singh
        const cx = 512;
        const cy = 360;
        const cr = 185;

        // Outer Glow
        ctx.save();
        ctx.shadowColor = 'rgba(31, 47, 152, 0.12)';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(cx, cy, cr, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.restore();

        if (drAakashImg && drAakashImg.complete && drAakashImg.naturalWidth > 0) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, cr, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();

          // Balanced framing centered directly on face
          const sw = Math.round(drAakashImg.naturalWidth * 0.85); // 746
          const sh = sw;
          const sx = Math.round((drAakashImg.naturalWidth - sw) / 2);
          const sy = Math.round(drAakashImg.naturalHeight * 0.02); // 20
          ctx.drawImage(drAakashImg, sx, sy, sw, sh, cx - cr, cy - cr, cr * 2, cr * 2);
          ctx.restore();
        }

        // Circular Frame Rings
        ctx.beginPath();
        ctx.arc(cx, cy, cr, 0, Math.PI * 2);
        ctx.strokeStyle = '#1F2F98';
        ctx.lineWidth = 10;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, cr + 7, 0, Math.PI * 2);
        ctx.strokeStyle = '#1CA7EC';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.font = '900 68px "Plus Jakarta Sans"';
        ctx.letterSpacing = '2px';
        ctx.fillStyle = '#020617';
        ctx.fillText('DR. AAKASH SINGH', 512, 630);

        ctx.font = '800 26px "Plus Jakarta Sans"';
        ctx.fillStyle = '#3B0764';
        ctx.fillText('MD (Medicine), DM (Clinical Immunology & Rheumatology)', 512, 680);

        ctx.font = '800 23px "Plus Jakarta Sans"';
        ctx.fillStyle = '#064E3B';
        ctx.fillText('AIR 1, PGIMER Chandigarh · AIIMS & JIPMER Alumnus', 512, 725);

        // Solid High-Contrast Pills
        const pills = [
          { label: 'Arthritis & SLE Care', color: '#1E1B4B', border: '#6D28D9', bg: '#EDE9FE', x: 280, y: 820 },
          { label: 'Biologics Infusion', color: '#042F2E', border: '#0F766E', bg: '#CCFBF1', x: 744, y: 820 },
          { label: 'MSK Ultrasound', color: '#172554', border: '#1D4ED8', bg: '#DBEAFE', x: 280, y: 905 },
          { label: 'Vasculitis Specialist', color: '#450A0A', border: '#DC2626', bg: '#FFE4E6', x: 744, y: 905 }
        ];
        pills.forEach(p => {
          ctx.fillStyle = p.bg;
          ctx.strokeStyle = p.border;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.roundRect(p.x - 200, p.y - 32, 400, 64, 32);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = p.color;
          ctx.font = '900 23px "Plus Jakarta Sans"';
          ctx.fillText(p.label, p.x, p.y + 8);
        });

        ctx.font = '800 26px "Noto Sans Devanagari"';
        ctx.fillStyle = '#020617';
        ctx.fillText('जटिल गठिया एवं ल्यूपस के विशेषज्ञ परामर्श', 512, 1030);

        ctx.fillStyle = '#172554';
        ctx.font = '900 28px "Plus Jakarta Sans"';
        ctx.fillText('Director & Lead Consultant', 512, 1140);
        ctx.fillStyle = '#0F172A';
        ctx.font = '800 22px "Plus Jakarta Sans"';
        ctx.fillText('ACORD Clinics Gorakhpur & Bhagalpur', 512, 1185);

      } else if (vMode === 'dr-ankita') {
        // DR. ANKITA PUNDIR
        ctx.fillStyle = '#0F766E';
        ctx.font = '900 24px "Plus Jakarta Sans"';
        ctx.letterSpacing = '5px';
        ctx.textAlign = 'center';
        ctx.fillText('DEPARTMENT OF DERMATOLOGY & AESTHETICS', 512, 120);

        // Circular Masked Portrait of Dr. Ankita Pundir
        const cx = 512;
        const cy = 360;
        const cr = 185;

        // Outer Glow
        ctx.save();
        ctx.shadowColor = 'rgba(15, 118, 110, 0.12)';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(cx, cy, cr, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.restore();

        if (drAnkitaImg && drAnkitaImg.complete && drAnkitaImg.naturalWidth > 0) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, cr, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();

          // Balanced framing centered directly on face matching Dr. Aakash scale
          const sw = drAnkitaImg.naturalWidth; // 576
          const sh = sw;
          const sx = 0;
          const sy = Math.round(drAnkitaImg.naturalHeight * 0.17); // 174
          ctx.drawImage(drAnkitaImg, sx, sy, sw, sh, cx - cr, cy - cr, cr * 2, cr * 2);
          ctx.restore();
        }

        // Circular Frame Rings
        ctx.beginPath();
        ctx.arc(cx, cy, cr, 0, Math.PI * 2);
        ctx.strokeStyle = '#0F766E';
        ctx.lineWidth = 10;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, cr + 7, 0, Math.PI * 2);
        ctx.strokeStyle = '#13BEB5';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.font = '900 68px "Plus Jakarta Sans"';
        ctx.letterSpacing = '2px';
        ctx.fillStyle = '#020617';
        ctx.fillText('DR. ANKITA PUNDIR', 512, 630);

        ctx.font = '800 26px "Plus Jakarta Sans"';
        ctx.fillStyle = '#0F766E';
        ctx.fillText('MBBS, MD (Dermatology, Venereology & Leprosy)', 512, 680);

        ctx.font = '800 23px "Plus Jakarta Sans"';
        ctx.fillStyle = '#172554';
        ctx.fillText('NEET PG AIR 1488 · AIIMS Rank 456 · S. Korea Fellow', 512, 725);

        const pills = [
          { label: 'Vitiligo Grafting Surgery', color: '#450A0A', border: '#DC2626', bg: '#FFE4E6', x: 280, y: 820 },
          { label: 'FUE Hair Transplant', color: '#451A03', border: '#D97706', bg: '#FEF3C7', x: 744, y: 820 },
          { label: 'Laser Aesthetics', color: '#042F2E', border: '#0F766E', bg: '#CCFBF1', x: 280, y: 905 },
          { label: 'Botox & Thread Lifts', color: '#1E1B4B', border: '#6D28D9', bg: '#EDE9FE', x: 744, y: 905 }
        ];
        pills.forEach(p => {
          ctx.fillStyle = p.bg;
          ctx.strokeStyle = p.border;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.roundRect(p.x - 200, p.y - 32, 400, 64, 32);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = p.color;
          ctx.font = '900 23px "Plus Jakarta Sans"';
          ctx.fillText(p.label, p.x, p.y + 8);
        });

        ctx.font = '800 26px "Noto Sans Devanagari"';
        ctx.fillStyle = '#020617';
        ctx.fillText('त्वचा, बाल एवं विटिलिगो सर्जरी की उन्नत तकनीक', 512, 1030);

        ctx.fillStyle = '#0F766E';
        ctx.font = '900 28px "Plus Jakarta Sans"';
        ctx.fillText('Director & Senior Dermatosurgeon', 512, 1140);
        ctx.fillStyle = '#0F172A';
        ctx.font = '800 22px "Plus Jakarta Sans"';
        ctx.fillText('ACORD Clinics Gorakhpur & Bhagalpur', 512, 1185);

      } else {
        // CLINIC DEFAULT EMBLEM
        ctx.fillStyle = '#064E3B';
        ctx.font = '900 24px "Plus Jakarta Sans"';
        ctx.letterSpacing = '5px';
        ctx.textAlign = 'center';
        ctx.fillText('SUPER-SPECIALITY CENTRE OF EXCELLENCE', 512, 120);

        if (logoImg && logoImg.complete && logoImg.naturalWidth > 0) {
          ctx.save();
          ctx.shadowColor = 'rgba(15, 118, 110, 0.25)';
          ctx.shadowBlur = 24;
          ctx.drawImage(logoImg, 512 - 200, 160, 400, 400);
          ctx.restore();
        }

        ctx.font = '900 78px "Plus Jakarta Sans"';
        ctx.letterSpacing = '4px';
        ctx.fillStyle = '#020617';
        ctx.fillText('ACORD CLINICS', 512, 670);

        // High contrast colored underline
        const uGrad = ctx.createLinearGradient(260, 0, 764, 0);
        uGrad.addColorStop(0, '#0F766E');
        uGrad.addColorStop(0.5, '#172554');
        uGrad.addColorStop(1, '#13BEB5');
        ctx.fillStyle = uGrad;
        ctx.fillRect(260, 695, 504, 7);

        ctx.font = '800 27px "Plus Jakarta Sans"';
        ctx.fillStyle = '#020617';
        ctx.letterSpacing = '1px';
        ctx.fillText('Autoimmunity Centre Of excellence in', 512, 760);
        ctx.font = '900 30px "Plus Jakarta Sans"';
        ctx.fillStyle = '#172554';
        ctx.fillText('Rheumatology & Dermatology', 512, 805);

        const pills = [
          { label: 'Arthritis & SLE', color: '#1E1B4B', border: '#6D28D9', bg: '#EDE9FE', x: 280, y: 890 },
          { label: 'Cold-Chain Biologics', color: '#042F2E', border: '#0F766E', bg: '#CCFBF1', x: 744, y: 890 },
          { label: 'Vitiligo Surgery', color: '#450A0A', border: '#DC2626', bg: '#FFE4E6', x: 280, y: 975 },
          { label: 'Lasers & Hair FUE', color: '#451A03', border: '#D97706', bg: '#FEF3C7', x: 744, y: 975 }
        ];

        pills.forEach(p => {
          ctx.fillStyle = p.bg;
          ctx.strokeStyle = p.border;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.roundRect(p.x - 200, p.y - 32, 400, 64, 32);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = p.color;
          ctx.font = '900 24px "Plus Jakarta Sans"';
          ctx.fillText(p.label, p.x, p.y + 8);
        });

        ctx.font = '800 26px "Noto Sans Devanagari"';
        ctx.fillStyle = '#020617';
        ctx.fillText('स्वास्थ्य और आत्मविश्वास की ओर सही मार्ग', 512, 1090);

        ctx.fillStyle = '#172554';
        ctx.font = '900 28px "Plus Jakarta Sans"';
        ctx.fillText('Gorakhpur (UP) · Bhagalpur (Bihar)', 512, 1190);

        ctx.fillStyle = '#0F172A';
        ctx.font = '800 22px "Plus Jakarta Sans"';
        ctx.fillText('Purvanchal · Bihar · Jharkhand Super-Speciality', 512, 1235);
      }

      ctx.font = '900 20px "Plus Jakarta Sans"';
      ctx.fillStyle = '#0F766E';
      ctx.fillText('✦ TAP OR DOUBLE-CLICK TO FLIP 180° ✦', 512, 1370);

      return c;
    }

    // Generate High-Contrast Back Canvas Texture
    function createBackCanvas() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1500;
      const ctx = c.getContext('2d');

      // 1. Rich Card Background Texture with Medical Depth
      const grad = ctx.createLinearGradient(0, 0, 1024, 1500);
      grad.addColorStop(0, '#d9effb');
      grad.addColorStop(0.5, '#eef6fc');
      grad.addColorStop(1, '#cae7f8');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1500);

      // Borders with Luminous Glow
      ctx.save();
      ctx.shadowColor = 'rgba(31, 47, 152, 0.45)';
      ctx.shadowBlur = 16;
      ctx.strokeStyle = '#1F2F98';
      ctx.lineWidth = 12;
      ctx.strokeRect(36, 36, 952, 1428);
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(19, 190, 181, 0.6)';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = '#0F766E';
      ctx.lineWidth = 3;
      ctx.strokeRect(52, 52, 920, 1396);
      ctx.restore();

      // Header
      ctx.fillStyle = '#172554';
      ctx.font = '900 48px "Plus Jakarta Sans"';
      ctx.textAlign = 'center';
      ctx.fillText('SCOPE OF SERVICES', 512, 120);

      ctx.fillStyle = '#064E3B';
      ctx.font = '800 23px "Plus Jakarta Sans"';
      ctx.fillText('Super-Speciality Protocols & Advanced Therapeutics', 512, 165);

      // Department 1: Rheumatology & Immunology
      ctx.fillStyle = '#EDE9FE';
      ctx.strokeStyle = '#6D28D9';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(70, 205, 884, 380, 24);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.fillStyle = '#3B0764';
      ctx.font = '900 30px "Plus Jakarta Sans"';
      ctx.fillText('RHEUMATOLOGY & AUTOIMMUNITY', 110, 260);

      ctx.fillStyle = '#020617';
      ctx.font = '800 23px "Plus Jakarta Sans"';
      const rheumBullets = [
        '• Inflammatory Arthritis (Rheumatoid, Ankylosing, Gout)',
        '• Lupus (SLE), Scleroderma, Myositis & CTDs',
        '• In-House Cold-Chain Targeted Biologics Infusions',
        '• MSK Ultrasound Guided Joint Injections & Biopsies',
        '• Systemic Vasculitis & Complex Autoimmune Care'
      ];
      rheumBullets.forEach((b, i) => {
        ctx.fillText(b, 110, 315 + i * 48);
      });

      // Department 2: Dermatology, Lasers & Hair
      ctx.fillStyle = '#CCFBF1';
      ctx.strokeStyle = '#0F766E';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(70, 610, 884, 380, 24);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#042F2E';
      ctx.font = '900 30px "Plus Jakarta Sans"';
      ctx.fillText('DERMATOLOGY, LASERS & AESTHETICS', 110, 665);

      ctx.fillStyle = '#020617';
      ctx.font = '800 23px "Plus Jakarta Sans"';
      const dermBullets = [
        '• Vitiligo Epidermal Cell Suspension & Grafting Surgery',
        '• Micro-FUE Hair Restoration & QR678® Bio-Peptides',
        '• Triple-Wavelength Diode Laser Hair Reduction',
        '• Q-Switched Nd:YAG Laser for Melasma & Pigmentation',
        '• Botox®, Fillers, Thread Lifts & Medical Chemical Peels'
      ];
      dermBullets.forEach((b, i) => {
        ctx.fillText(b, 110, 720 + i * 48);
      });

      // Direct Appointment Lines Box
      ctx.fillStyle = '#FFFFFF';
      ctx.strokeStyle = '#172554';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(70, 1015, 884, 180, 20);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#172554';
      ctx.font = '900 26px "Plus Jakarta Sans"';
      ctx.fillText('DIRECT CLINIC APPOINTMENT LINES', 512, 1060);

      ctx.fillStyle = '#020617';
      ctx.font = '900 25px "Plus Jakarta Sans"';
      ctx.fillText('Gorakhpur: +91 77029 41735 / +91 91980 43636', 512, 1110);
      ctx.fillText('Bhagalpur: +91 79034 68113', 512, 1155);

      // Book Consultation CTA Button
      const btnGrad = ctx.createLinearGradient(200, 1225, 824, 1340);
      btnGrad.addColorStop(0, '#172554');
      btnGrad.addColorStop(0.5, '#0F766E');
      btnGrad.addColorStop(1, '#064E3B');
      ctx.fillStyle = btnGrad;
      ctx.beginPath();
      ctx.roundRect(220, 1225, 584, 94, 47);
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 32px "Plus Jakarta Sans"';
      ctx.fillText('📅 BOOK CONSULTATION', 512, 1285);

      ctx.font = '900 20px "Plus Jakarta Sans"';
      ctx.fillStyle = '#0F766E';
      ctx.fillText('✦ DOUBLE-CLICK OR PRESS F TO FLIP BACK ✦', 512, 1380);

      return c;
    }

    const cardGroup = new THREE.Group();
    cardGroup.position.y = 0.24; // Elevate card so bottom text is completely clear of HUD buttons
    scene.add(cardGroup);

    const frontCanvas = createFrontCanvas(variant);
    const frontTexture = new THREE.CanvasTexture(frontCanvas);
    frontTexture.colorSpace = THREE.SRGBColorSpace;
    frontTexture.anisotropy = 16;

    const backCanvas = createBackCanvas();
    const backTexture = new THREE.CanvasTexture(backCanvas);
    backTexture.colorSpace = THREE.SRGBColorSpace;
    backTexture.anisotropy = 16;

    function refreshFrontTexture() {
      const refreshedFront = createFrontCanvas(variant);
      frontTexture.image = refreshedFront;
      frontTexture.needsUpdate = true;
    }

    logoImg.onload = refreshFrontTexture;
    drAakashImg.onload = refreshFrontTexture;
    drAnkitaImg.onload = refreshFrontTexture;

    const frontMat = new THREE.MeshBasicMaterial({
      map: frontTexture,
      toneMapped: false
    });

    const backMat = new THREE.MeshBasicMaterial({
      map: backTexture,
      toneMapped: false
    });

    const edgeMat = new THREE.MeshBasicMaterial({
      color: 0x13BEB5,
      toneMapped: false
    });

    const frontPlaneGeo = new THREE.PlaneGeometry(CARD_W, CARD_H, 32, 32);
    const frontMesh = new THREE.Mesh(frontPlaneGeo, frontMat);
    frontMesh.position.z = CARD_DEPTH / 2 + 0.001;
    cardGroup.add(frontMesh);

    const backPlaneGeo = new THREE.PlaneGeometry(CARD_W, CARD_H, 32, 32);
    const backMesh = new THREE.Mesh(backPlaneGeo, backMat);
    backMesh.position.z = -(CARD_DEPTH / 2 + 0.001);
    backMesh.rotation.y = Math.PI;
    cardGroup.add(backMesh);

    const cardBoxGeo = new THREE.BoxGeometry(CARD_W, CARD_H, CARD_DEPTH);
    const cardBoxMesh = new THREE.Mesh(cardBoxGeo, edgeMat);
    cardGroup.add(cardBoxMesh);

    // 3D Ambient Medical Holographic Glow Aura Plane
    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = 256;
    glowCanvas.height = 256;
    const gCtx = glowCanvas.getContext('2d');
    const gGrad = gCtx.createRadialGradient(128, 128, 20, 128, 128, 126);
    gGrad.addColorStop(0, 'rgba(19, 190, 181, 0.45)');
    gGrad.addColorStop(0.35, 'rgba(31, 47, 152, 0.28)');
    gGrad.addColorStop(0.7, 'rgba(137, 234, 215, 0.16)');
    gGrad.addColorStop(1, 'rgba(19, 190, 181, 0)');
    gCtx.fillStyle = gGrad;
    gCtx.fillRect(0, 0, 256, 256);
    const glowTexture = new THREE.CanvasTexture(glowCanvas);

    const glowMat = new THREE.MeshBasicMaterial({
      map: glowTexture,
      transparent: true,
      opacity: 0.72,
      depthWrite: false,
      toneMapped: false,
      blending: THREE.NormalBlending
    });
    const glowPlaneGeo = new THREE.PlaneGeometry(CARD_W * 1.34, CARD_H * 1.26);
    const glowMesh = new THREE.Mesh(glowPlaneGeo, glowMat);
    glowMesh.position.z = 0;
    cardGroup.add(glowMesh);

    // Interaction controls
    let targetRotationX = 0;
    let targetRotationY = 0;
    let currentRotationX = 0;
    let currentRotationY = 0;
    let isFlipped = false;
    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;
    let pointerPos = new THREE.Vector2(0.5, 0.5);

    function toggleFlip() {
      isFlipped = !isFlipped;
      targetRotationY = isFlipped ? Math.PI : 0;
      targetRotationX = 0;
      document.getElementById('flipLabel').textContent = isFlipped ? 'Show Front' : 'Flip 180°';
    }

    function resetView() {
      isFlipped = false;
      targetRotationX = 0;
      targetRotationY = 0;
      document.getElementById('flipLabel').textContent = 'Flip 180°';
    }

    window.addEventListener('pointermove', (e) => {
      const normX = e.clientX / window.innerWidth;
      const normY = e.clientY / window.innerHeight;
      pointerPos.set(normX, normY);

      if (isDragging) {
        const deltaX = e.clientX - prevMouseX;
        const deltaY = e.clientY - prevMouseY;
        targetRotationY += deltaX * 0.008;
        targetRotationX += deltaY * 0.008;
        targetRotationX = Math.max(-1.1, Math.min(1.1, targetRotationX));
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      } else {
        const tiltX = (normY - 0.5) * -0.38;
        const tiltY = (normX - 0.5) * 0.38;
        if (!isFlipped) {
          targetRotationX = tiltX;
          targetRotationY = tiltY;
        } else {
          targetRotationX = tiltX;
          targetRotationY = Math.PI - tiltY;
        }
      }
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.hud-btn')) return;
      isDragging = true;
      document.body.classList.add('dragging');
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
      document.body.classList.remove('dragging');
    });

    window.addEventListener('dblclick', (e) => {
      if (e.target.closest('.hud-btn')) return;
      toggleFlip();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') toggleFlip();
      if (e.key === 'r' || e.key === 'R') resetView();
      if (e.key === 'ArrowLeft') targetRotationY -= 0.2;
      if (e.key === 'ArrowRight') targetRotationY += 0.2;
      if (e.key === 'ArrowUp') targetRotationX -= 0.2;
      if (e.key === 'ArrowDown') targetRotationX += 0.2;
    });

    window.addEventListener('wheel', (e) => {
      // Allow outer page scrolling smoothly without trapping the user
    }, { passive: true });

    document.getElementById('btnFlip').addEventListener('click', toggleFlip);
    document.getElementById('btnReset').addEventListener('click', resetView);
    document.getElementById('btnBook').addEventListener('click', () => {
      window.parent.postMessage({ type: 'acord:book', variant: variant }, '*');
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let isTabVisible = !document.hidden;
    document.addEventListener('visibilitychange', () => {
      isTabVisible = !document.hidden;
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      if (!isTabVisible) return;

      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      currentRotationX += (targetRotationX - currentRotationX) * 0.1;
      currentRotationY += (targetRotationY - currentRotationY) * 0.1;

      cardGroup.rotation.x = currentRotationX;
      cardGroup.rotation.y = currentRotationY;

      // Subtle breathing glow aura on the card
      glowMat.opacity = 0.68 + Math.sin(elapsed * 2.2) * 0.10;

      const pos = particleGeo.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        pos[i * 3 + 1] += particleSpeeds[i].y;
        pos[i * 3 + 0] += Math.sin(elapsed + particleSpeeds[i].r) * 0.0012;

        if (pos[i * 3 + 1] > 2.6) {
          pos[i * 3 + 1] = -2.2;
          pos[i * 3 + 0] = (Math.random() - 0.5) * 5.5;
        }
      }
      particleGeo.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
